<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#210c20">
<title>B&amp;R APP · Belle &amp; Rebelle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#100712;overflow:hidden}
  iframe{border:0;width:100%;height:100%;display:block}
  #offline{display:none;position:fixed;inset:0;align-items:center;justify-content:center;color:#f6e9f4;font-family:system-ui,sans-serif;text-align:center;padding:24px;background:#100712}
</style>
</head>
<body>
<iframe id="site" title="Belle &amp; Rebelle" src="../?source=pwa" allow="autoplay; fullscreen; clipboard-write"></iframe>
<p id="offline">Connexion indisponible. Le site reprendra dès que vous serez de nouveau en ligne.</p>
<script>
(() => {
  'use strict';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).catch(() => {});
  }
  const offline = document.getElementById('offline');
  const show = () => { offline.style.display = navigator.onLine ? 'none' : 'flex'; };
  window.addEventListener('online', show);
  window.addEventListener('offline', show);
  show();
})();
</script>
</body>
</html>
